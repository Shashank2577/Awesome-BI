version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin
      - DB_NAME=reporting
    volumes:
      - ./backend:/app
    depends_on:
      - db

  # Custom BI Frontend (Next.js) - replaces Metabase
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    profiles:
      - full

  # Legacy: Metabase OSS frontend - replaced by custom frontend
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=reporting
      - MB_DB_PORT=5432
      - MB_DB_USER=admin
      - MB_DB_PASS=admin
      - MB_DB_HOST=db
    depends_on:
      - db
    profiles:
      - legacy

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=reporting
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
